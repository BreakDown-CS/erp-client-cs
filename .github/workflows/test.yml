name: Build ERP Client

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build Docker Image
        run: |
          docker build \
            -t erp-client-cs:test .
